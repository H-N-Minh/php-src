name: Build Windows PHP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install BuildPhp PowerShell Module
        shell: pwsh
        run: Install-Module -Name BuildPhp -Repository PSGallery -Force

      - name: Build PHP from source
        shell: pwsh
        run: Invoke-PhpBuild -Arch x64 -Ts nts

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-windows-x64
          path: |
            artifacts/
            **/php.exe
