name: Build Windows PHP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-2019
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP SDK
        uses: php/setup-php-sdk@v0.8.8
        with:
          mode: php-src
          version: '7.4'
          arch: x64
          ts: 0

      - name: Build PHP CLI
        shell: cmd
        run: |
          buildconf.bat
          configure.bat --disable-all --enable-cli
          nmake

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-windows-x64
          path: |
            **/php.exe
